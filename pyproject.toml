[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raglab"
version = "0.1.0"
description = "RAG playground for chunking/embedding experiments"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<2",
  "pypdf>=4.0",
  "requests>=2.31",
  "langchain>=1.0",
  "langchain-openai>=1.0",
]
